services:
  backend:
    build:
      context: ./backend
    container_name: mockmate-backend
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=${MONGO_URI}
      - PORT=5000
    restart: always
  
  frontend:
    build:
      context: ./frontend
    container_name: mockmate-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always